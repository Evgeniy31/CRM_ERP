{% extends "admin/base.html" %}

{% block title %}Edit {{ opts.verbose_name }}{% endblock %}

{% block content %}
<div class="container">
    <h1>Edit {{ opts.verbose_name }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'admin:index' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
